# Deploy: fly launch --no-deploy && fly volumes create media_data --size 1 --region sin && fly secrets set ... && fly deploy
app = "ai-media-office"
primary_region = "sin" # Singapura, terdekat ke Jakarta

[build]

[env]
  TIMEZONE = "Asia/Jakarta"

[[mounts]]
  source = "media_data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  # Scheduler berjalan di dalam server, jadi mesin tidak boleh tidur.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
